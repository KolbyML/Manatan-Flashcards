name: Flashcards extensions

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [all, reviewer-progress, review-heatmap, anki-connect]
        default: all
      rollout:
        description: Percentage of clients eligible for this release
        type: number
        default: 100

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and wasm-tools
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          WASM_TOOLS_VERSION: 1.263.0
          WASM_TOOLS_SHA256: 21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          archive="wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux"
          curl --fail --location --retry 3 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/$archive.tar.gz" \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "$WASM_TOOLS_SHA256  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP" "$archive/wasm-tools"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Test the SDK and extensions
        run: cargo test --workspace --locked
      - name: Build and validate component packages
        run: bash scripts/package-extensions.sh target/extension-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flashcards-extensions
          path: target/extension-packages/*.mext
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: extension-production
    permissions:
      contents: write
    concurrency:
      group: extension-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: extension-feed
          path: extension-feed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flashcards-extensions
          path: packages
      - name: Install publisher dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/extension-publisher"
          "$RUNNER_TEMP/extension-publisher/bin/python" -m pip install --requirement scripts/extension-signing-requirements.txt
          echo "$RUNNER_TEMP/extension-publisher/bin" >> "$GITHUB_PATH"
      - name: Sign feed metadata
        env:
          PACKAGE: ${{ inputs.package }}
          ROLLOUT: ${{ inputs.rollout }}
          PUBLISHER_PEM: ${{ secrets.EXTENSION_SIGNING_PUBLISHER_PEM }}
        run: bash scripts/sign-extension-feed.sh extension-feed packages "$PACKAGE" "$ROLLOUT"
      - name: Publish public feed files
        working-directory: extension-feed
        run: |
          git add -- metadata targets
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "Publish Flashcards extension feed" -m "Source: $GITHUB_SHA"
          git push origin HEAD:refs/heads/extension-feed
