name: Flashcards extensions

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        type: choice
        options: [all, reviewer-progress, review-heatmap, anki-connect]
        default: all
      rollout:
        description: Percentage of clients eligible for this release
        type: number
        default: 100

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and wasm-tools
        env:
          RUSTUP_TOOLCHAIN: 1.96.1
          WASM_TOOLS_VERSION: 1.263.0
          WASM_TOOLS_SHA256: 21c036c1740a0552124c79c6e2170cb61c5b016005671a6d5bc06cf642165431
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target wasm32-unknown-unknown
          printf 'RUSTUP_TOOLCHAIN=%s\n' "$RUSTUP_TOOLCHAIN" >> "$GITHUB_ENV"
          archive="wasm-tools-$WASM_TOOLS_VERSION-x86_64-linux"
          curl --fail --location --retry 3 \
            "https://github.com/bytecodealliance/wasm-tools/releases/download/v$WASM_TOOLS_VERSION/$archive.tar.gz" \
            --output "$RUNNER_TEMP/wasm-tools.tar.gz"
          echo "$WASM_TOOLS_SHA256  $RUNNER_TEMP/wasm-tools.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/wasm-tools.tar.gz" -C "$RUNNER_TEMP" "$archive/wasm-tools"
          echo "$RUNNER_TEMP/$archive" >> "$GITHUB_PATH"
      - name: Test the SDK and extensions
        run: cargo test --workspace --locked
      - name: Build and validate component packages
        run: bash scripts/package-extensions.sh target/extension-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flashcards-extensions
          path: target/extension-packages/*.mext
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: extension-production
    concurrency:
      group: extension-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flashcards-extensions
          path: packages
      - name: Publish the verified build through the Manatan signing host
        env:
          PACKAGE: ${{ inputs.package }}
          ROLLOUT: ${{ inputs.rollout }}
          PUBLISH_HOST: ${{ vars.EXTENSION_PUBLISH_HOST }}
          PUBLISH_USER: ${{ vars.EXTENSION_PUBLISH_USER }}
          PUBLISH_KEY: ${{ secrets.EXTENSION_PUBLISH_SSH_KEY }}
          PUBLISH_KNOWN_HOSTS: ${{ secrets.EXTENSION_PUBLISH_KNOWN_HOSTS }}
        run: |
          if [[ -z "$PUBLISH_HOST" || -z "$PUBLISH_USER" || -z "$PUBLISH_KEY" || -z "$PUBLISH_KNOWN_HOSTS" ]]; then
            echo "::error::Configure the signing host in the extension-production environment."
            exit 1
          fi
          if [[ ! "$ROLLOUT" =~ ^(0|[1-9][0-9]?|100)$ ]]; then
            echo "::error::Rollout must be an integer from 0 to 100."
            exit 1
          fi
          case "$PACKAGE" in
            all) files=(packages/*.mext) ;;
            reviewer-progress|review-heatmap|anki-connect) files=(packages/"$PACKAGE"-*.mext) ;;
            *) exit 1 ;;
          esac
          ssh_config="$(mktemp -d)"
          trap 'rm -rf "$ssh_config"' EXIT
          chmod 700 "$ssh_config"
          (umask 077; printf '%s\n' "$PUBLISH_KEY" > "$ssh_config/key")
          printf '%s\n' "$PUBLISH_KNOWN_HOSTS" > "$ssh_config/known_hosts"
          tar --format=ustar -cf - -C packages "${files[@]#packages/}" | ssh -T \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_config/known_hosts" -o ConnectTimeout=15 \
            -i "$ssh_config/key" -l "$PUBLISH_USER" -- "$PUBLISH_HOST" "publish $ROLLOUT"
          for file in "${files[@]}"; do
            hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
            expected="$hash  $ssh_config/target"
            curl --fail --silent --show-error --retry 3 \
              "https://manatan.com/api/srs/extension-updates/targets/$hash.${file##*/}" \
              --output "$ssh_config/target"
            echo "$expected" | sha256sum --check --status
          done
          curl --fail --silent --show-error --retry 3 --output /dev/null \
            https://manatan.com/api/srs/extension-updates/metadata/timestamp.json
